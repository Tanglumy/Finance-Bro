[project]
name = "agent"
version = "0.0.1"
description = "Backend for the LangGraph agent"
authors = [
    { name = "Philipp Schmid", email = "schmidphilipp1995@gmail.com" },
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<4.0"
dependencies = [
    "langgraph>=0.2.6",
    "langchain>=0.3.19",
    "langchain-google-genai",
    "python-dotenv>=1.0.1",
    "langgraph-sdk>=0.1.57",
    "langgraph-cli",
    "langgraph-api",
    "fastapi",
    "google-genai",
    "aiohttp>=3.8.0",
    "pandas>=1.5.0",
    "numpy>=1.24.0",
    "yfinance>=0.2.0",
    "alpha-vantage>=2.3.0",
    "newsapi-python>=0.2.0",
    "requests>=2.28.0",
    "python-dateutil>=2.8.0",
    # Time Series and ML Dependencies
    "nixtla>=0.5.0",
    "nixtlats>=0.1.0",
    "gluonts>=0.15.0",
    "mxnet>=1.9.1",
    "torch>=2.0.0",
    "pytorch-lightning>=2.0.0",
    "statsforecast>=1.6.0",
    "neuralforecast>=1.6.0",
    "mlforecast>=0.10.0",
    "pandas-ta>=0.3.14b",
    "scikit-learn>=1.3.0",
    "scipy>=1.10.0",
    "ta-lib>=0.4.25",
    "plotly>=5.15.0",
    # IBKR Integration
    "ibapi>=9.81.1",
    "ib-insync>=0.9.86",
    # Additional Financial Data
    "quandl>=3.7.0",
    "fredapi>=0.5.0",
    "ccxt>=4.1.0",
]


[project.optional-dependencies]
dev = ["mypy>=1.11.1", "ruff>=0.6.1"]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # First line should be in imperative mood
    "T201",
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    # We actually do want to import from typing_extensions
    "UP035",
    # Relax the convention by _not_ requiring documentation for every function parameter.
    "D417",
    "E501",
]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]
[tool.ruff.lint.pydocstyle]
convention = "google"

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.1.71",
    "pytest>=8.3.5",
]
