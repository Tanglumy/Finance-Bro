version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8001
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - finance-bro-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8001:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - NIXTLA_API_KEY=${NIXTLA_API_KEY:-}
      - ALPHA_VANTAGE_API_KEY=${ALPHA_VANTAGE_API_KEY:-}
      - NEWS_API_KEY=${NEWS_API_KEY:-}
      - USE_IBKR=${USE_IBKR:-false}
      - IBKR_HOST=${IBKR_HOST:-127.0.0.1}
      - IBKR_PORT=${IBKR_PORT:-7497}
      - IBKR_CLIENT_ID=${IBKR_CLIENT_ID:-1}
    volumes:
      - ./backend:/app
    networks:
      - finance-bro-network
    command: ["langgraph", "dev", "--host", "0.0.0.0", "--port", "8000", "--reload"]

networks:
  finance-bro-network:
    driver: bridge