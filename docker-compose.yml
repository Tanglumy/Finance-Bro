version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8001
    networks:
      - finance-bro-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - NIXTLA_API_KEY=${NIXTLA_API_KEY:-}
      - ALPHA_VANTAGE_API_KEY=${ALPHA_VANTAGE_API_KEY:-}
      - NEWS_API_KEY=${NEWS_API_KEY:-}
      - USE_IBKR=${USE_IBKR:-false}
      - IBKR_HOST=${IBKR_HOST:-127.0.0.1}
      - IBKR_PORT=${IBKR_PORT:-7497}
      - IBKR_CLIENT_ID=${IBKR_CLIENT_ID:-1}
    volumes:
      - ./backend:/app
      - backend_data:/app/data
    networks:
      - finance-bro-network
    restart: unless-stopped

  # Optional: Redis for caching
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - finance-bro-network
    restart: unless-stopped

  # Optional: PostgreSQL for persistent data
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=finance_bro
      - POSTGRES_USER=finance_bro
      - POSTGRES_PASSWORD=finance_bro_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - finance-bro-network
    restart: unless-stopped

volumes:
  backend_data:
  redis_data:
  postgres_data:

networks:
  finance-bro-network:
    driver: bridge